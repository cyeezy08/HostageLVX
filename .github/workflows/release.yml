# .github/workflows/release.yml
# Release pipeline — cross-compile, sign with cosign, generate SBOM,
# publish Docker image to GHCR. Triggers on tag push v*.*.*
#
# To cut a release:
#   git tag v0.3.0
#   git push origin v0.3.0
#
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # create GitHub release + upload assets
  packages: write    # push Docker image to GHCR
  id-token: write    # cosign keyless signing

jobs:
  release:
    name: Build & release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Parse version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build all platforms
        run: |
          mkdir -p dist
          VERSION="${{ steps.ver.outputs.version }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/hostage-linux-amd64 .
          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/hostage-linux-arm64 .
          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/hostage-windows-amd64.exe .
          # macOS arm64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/hostage-darwin-arm64 .
          # macOS amd64 (Intel)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/hostage-darwin-amd64 .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum hostage-* | tee checksums.sha256

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: hostage-sbom.spdx.json
          format: spdx-json
          output-file: dist/hostage-sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binaries (keyless)
        run: |
          cd dist
          for f in hostage-linux-amd64 hostage-linux-arm64 hostage-windows-amd64.exe hostage-darwin-arm64 hostage-darwin-amd64; do
            cosign sign-blob --yes --output-certificate "${f}.pem" --output-signature "${f}.sig" "${f}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/hostage-linux-amd64
            dist/hostage-linux-arm64
            dist/hostage-windows-amd64.exe
            dist/hostage-darwin-arm64
            dist/hostage-darwin-amd64
            dist/checksums.sha256
            dist/hostage-sbom.spdx.json
            dist/*.pem
            dist/*.sig

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign Docker image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.meta.outputs.digest }}
